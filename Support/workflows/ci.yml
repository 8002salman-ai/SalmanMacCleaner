name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS, arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Structural validation (no Xcode required)
        run: python3 Tools/validate_project.py

      - name: Resolve Swift packages
        run: |
          xcodebuild -project SalmanMacCleaner.xcodeproj \
            -scheme SalmanMacCleaner \
            -resolvePackageDependencies

      - name: Build (Debug, unsigned)
        run: |
          xcodebuild \
            -project SalmanMacCleaner.xcodeproj \
            -scheme SalmanMacCleaner \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project SalmanMacCleaner.xcodeproj \
            -scheme SalmanMacCleaner \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          xcodebuild \
            -project SalmanMacCleaner.xcodeproj \
            -scheme SalmanMacCleaner \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            test
